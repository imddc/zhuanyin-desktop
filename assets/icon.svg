<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">转音</title>
  <desc id="desc">蓝色声波过渡为白色文本，表示将录音转成逐字稿。</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#263444"/>
      <stop offset="1" stop-color="#16202c"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" fill="none" stroke="#9eafc4" stroke-opacity=".2"/>
  <!-- A shared centerline connects the incoming waveform to the transcript. -->
  <g fill="#6cb2ff">
    <rect x="24" y="53" width="8" height="22" rx="4"/>
    <rect x="38" y="39" width="8" height="50" rx="4"/>
    <rect x="52" y="47" width="8" height="34" rx="4"/>
  </g>
  <g fill="#f4f8fd">
    <rect x="70" y="43" width="34" height="8" rx="4"/>
    <rect x="66" y="60" width="30" height="8" rx="4"/>
    <rect x="70" y="77" width="22" height="8" rx="4"/>
  </g>
</svg>
