# 功能请求表单。自动打 `enhancement`，与 antfu 的 feature_request.yml 一致。
name: 功能请求
description: 新增或改进一项能力
title: 'feat: '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        写清「要解决什么问题」比「要加什么功能」更重要 —— 方案可以换，问题不能换。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在哪里别扭、缺什么、多花多少时间
      placeholder: 每次面试录音都要手动建日记条目，一次要花两分钟……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 你期望的行为。如果涉及取舍，把备选写进下一节
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 试过或想过的其他做法，以及为什么不如上面那个
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: 影响范围
      description: 可能动到哪些模块（引擎 / 界面 / 构建 / 文档），是否需要破坏性变更
    validations:
      required: false

  - type: checkboxes
    id: self-check
    attributes:
      label: 自查
      options:
        - label: 已搜过 issue 与已有功能，没有重复
          required: true
        - label: 我描述的是问题而不是单一实现方案
          required: true
